services:
  redis:
    image: redis:alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: taskflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/TaskFlow.Api/Dockerfile
    container_name: taskflow-api
    ports:
      - "5000:8080"
    environment:
      - MongoDB__ConnectionString=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme123}@mongodb:27017?authSource=admin
      - MongoDB__DatabaseName=${MongoDB__DatabaseName:-taskflow}
      - Redis__Connection=redis:6379
      - Storage__Path=/app/wwwroot/pdfs
      - Storage__BaseUrl=http://localhost:5000/pdfs/
    volumes:
      - ./src/TaskFlow.Api/wwwroot:/app/wwwroot
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/TaskFlow.Worker/Dockerfile
    container_name: taskflow-worker
    environment:
      - MongoDB__ConnectionString=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme123}@mongodb:27017?authSource=admin
      - MongoDB__DatabaseName=${MongoDB__DatabaseName:-taskflow}
      - Redis__Connection=redis:6379
      - Storage__Path=/app/wwwroot/pdfs
      - Storage__BaseUrl=http://localhost:5000/pdfs/
    volumes:
      - ./src/TaskFlow.Api/wwwroot:/app/wwwroot
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
